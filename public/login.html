<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - AptiAce</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>AptiAce</h1>

            <p class="subtitle">
                Crack your next interview
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <label>Gmail ID</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@gmail.com"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="switch-page">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
