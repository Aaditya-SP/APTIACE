<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AptiAce - Percentage Practice</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: white;

            padding: 18px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .logo {

            font-size: 30px;

            font-weight: bold;
        }


        .back-btn {

            background: #4f46e5;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            max-width: 900px;

            margin: 40px auto;

            padding: 0 20px;
        }


        /* =========================
           QUIZ HEADER
        ========================= */

        .quiz-header {

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 20px;
        }


        .quiz-title {

            margin: 0;

            font-size: 28px;
        }


        .quiz-info {

            display: flex;

            justify-content: space-between;

            margin-top: 15px;

            color: #666;

            font-size: 15px;
        }


        /* =========================
           PROGRESS BAR
        ========================= */

        .progress-container {

            width: 100%;

            height: 10px;

            background: #e5e7eb;

            border-radius: 10px;

            margin-top: 20px;

            overflow: hidden;
        }


        .progress-bar {

            height: 100%;

            width: 4%;

            background: #4f46e5;

            transition: width 0.3s;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }


        .difficulty {

            display: inline-block;

            padding: 7px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        .easy {

            background: #dcfce7;

            color: #166534;
        }


        .medium {

            background: #fef9c3;

            color: #854d0e;
        }


        .hard {

            background: #fed7aa;

            color: #9a3412;
        }


        .advanced {

            background: #fee2e2;

            color: #991b1b;
        }


        .interview {

            background: #ede9fe;

            color: #5b21b6;
        }


        .question {

            font-size: 23px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* =========================
           OPTIONS
        ========================= */

        .options {

            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .option {

            border: 2px solid #e5e7eb;

            background: white;

            padding: 16px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 17px;

            transition: 0.2s;
        }


        .option:hover {

            border-color: #4f46e5;

            background: #f5f3ff;
        }


        .option.selected {

            border-color: #4f46e5;

            background: #eef2ff;
        }


        .option.correct {

            border-color: #16a34a;

            background: #dcfce7;
        }


        .option.wrong {

            border-color: #dc2626;

            background: #fee2e2;
        }


        /* =========================
           BUTTON
        ========================= */

        .button-container {

            margin-top: 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .submit-btn {

            background: #4f46e5;

            color: white;

            border: none;

            padding: 14px 28px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }


        .submit-btn:hover {

            background: #3730a3;
        }


        .submit-btn:disabled {

            background: #a5b4fc;

            cursor: not-allowed;
        }


        /* =========================
           FEEDBACK
        ========================= */

        .feedback {

            margin-top: 25px;

            padding: 20px;

            border-radius: 10px;

            display: none;

            line-height: 1.6;
        }


        .feedback.correct-feedback {

            display: block;

            background: #dcfce7;

            border-left: 5px solid #16a34a;
        }


        .feedback.wrong-feedback {

            display: block;

            background: #fee2e2;

            border-left: 5px solid #dc2626;
        }


        .feedback-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        /* =========================
           RESULT PAGE
        ========================= */

        .result {

            display: none;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            text-align: center;
        }


        .result h1 {

            font-size: 35px;
        }


        .score {

            font-size: 55px;

            font-weight: bold;

            color: #4f46e5;

            margin: 20px;
        }


        .percentage-score {

            font-size: 22px;

            color: #666;
        }


        /* =========================
           SCORE TABLE
        ========================= */

        .score-table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 30px;
        }


        .score-table th,
        .score-table td {

            padding: 14px;

            border-bottom:
                1px solid #e5e7eb;
        }


        .score-table th {

            background: #f8fafc;
        }


        /* =========================
           RESULT BUTTONS
        ========================= */

        .result-buttons {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .result-btn {

            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }


        .restart {

            background: #4f46e5;

            color: white;
        }


        .topics {

            background: #e5e7eb;

            color: #222;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 650px) {

            .header {

                padding: 15px 20px;
            }

            .logo {

                font-size: 24px;
            }

            .container {

                margin: 20px auto;
            }

            .question-card {

                padding: 22px;
            }

            .question {

                font-size: 19px;
            }

            .quiz-info {

                flex-direction: column;

                gap: 8px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        AptiAce
    </div>


    <button
        class="back-btn"
        onclick="window.location.href='percentage.html'">

        ← Formulas

    </button>

</header>



<!-- =========================
     QUIZ CONTAINER
========================= -->

<main class="container">


    <!-- QUIZ -->

    <section id="quiz">


        <!-- QUIZ HEADER -->

        <div class="quiz-header">

            <h1 class="quiz-title">
                Percentage Practice
            </h1>


            <div class="quiz-info">

                <span id="questionNumber">
                    Question 1 of 25
                </span>

                <span id="difficultyText">
                    Easy
                </span>

            </div>


            <div class="progress-container">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

        </div>



        <!-- QUESTION -->

        <div class="question-card">


            <div
                id="difficultyBadge"
                class="difficulty easy">

                EASY

            </div>


            <div
                id="questionText"
                class="question">

                Loading question...

            </div>


            <!-- OPTIONS -->

            <div
                id="options"
                class="options">
            </div>


            <!-- FEEDBACK -->

            <div
                id="feedback"
                class="feedback">

                <div
                    id="feedbackTitle"
                    class="feedback-title">
                </div>


                <div
                    id="feedbackText">
                </div>

            </div>


            <!-- BUTTON -->

            <div class="button-container">

                <span id="selectionMessage">
                    Select an answer
                </span>


                <button
                    id="submitButton"
                    class="submit-btn"
                    disabled>

                    Submit Answer

                </button>

            </div>


        </div>

    </section>



    <!-- =========================
         RESULT
    ========================= -->

    <section
        id="result"
        class="result">


        <h1>
            Test Complete!
        </h1>


        <div
            id="finalScore"
            class="score">

            0 / 25

        </div>


        <div
            id="percentageScore"
            class="percentage-score">

            0%

        </div>


        <p id="resultMessage">
        </p>


        <table class="score-table">

            <thead>

                <tr>

                    <th>
                        Difficulty
                    </th>

                    <th>
                        Score
                    </th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>
                        🟢 Easy
                    </td>

                    <td id="easyScore">
                        0 / 5
                    </td>

                </tr>


                <tr>

                    <td>
                        🟡 Medium
                    </td>

                    <td id="mediumScore">
                        0 / 5
                    </td>

                </tr>


                <tr>

                    <td>
                        🟠 Hard
                    </td>

                    <td id="hardScore">
                        0 / 5
                    </td>

                </tr>


                <tr>

                    <td>
                        🔴 Advanced
                    </td>

                    <td id="advancedScore">
                        0 / 5
                    </td>

                </tr>


                <tr>

                    <td>
                        🔥 Interview
                    </td>

                    <td id="interviewScore">
                        0 / 5
                    </td>

                </tr>

            </tbody>

        </table>


        <div class="result-buttons">

            <button
                class="result-btn restart"
                onclick="restartQuiz()">

                Try Again

            </button>


            <button
                class="result-btn topics"
                onclick="window.location.href='quantitative.html'">

                Back to Topics

            </button>

        </div>


    </section>


</main>



<script>


/* =====================================================
   QUESTION DATABASE
===================================================== */


let questions = [];
async function loadQuestionsFromDatabase() {

    try {

        const response = await fetch(
            "/api/questions?topic=Percentage"
        );

        if (!response.ok) {

            throw new Error(
                "Unable to load questions"
            );

        }

        const databaseQuestions =
            await response.json();


     questions = databaseQuestions.map(q => ({

    id: q.id,

    question: q.question,

    options: [
        q.option_a,
        q.option_b,
        q.option_c,
        q.option_d
    ],

    answer: q.correct_answer.charCodeAt(0) - 65,

    difficulty: q.difficulty.toLowerCase(),

    explanation: q.explanation

}));

        console.log(
            "Questions loaded from SQLite:",
            questions
        );


        if (questions.length === 0) {

            alert(
                "No Percentage questions found in the database."
            );

            return;

        }


        loadQuestion();

    }

    catch (error) {

        console.error(
            "Error loading questions:",
            error
        );

        alert(
            "Unable to load questions from the database."
        );

    }

}

/* =====================================================
   QUIZ VARIABLES
===================================================== */


let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;

let answerSubmitted = false;


let difficultyScores = {

    easy: 0,

    medium: 0,

    hard: 0,

    advanced: 0,

    interview: 0

};



/* =====================================================
   HTML ELEMENTS
===================================================== */


const questionText =
    document.getElementById("questionText");


const optionsContainer =
    document.getElementById("options");


const submitButton =
    document.getElementById("submitButton");


const feedback =
    document.getElementById("feedback");


const feedbackTitle =
    document.getElementById("feedbackTitle");


const feedbackText =
    document.getElementById("feedbackText");


const questionNumber =
    document.getElementById("questionNumber");


const difficultyText =
    document.getElementById("difficultyText");


const difficultyBadge =
    document.getElementById("difficultyBadge");


const progressBar =
    document.getElementById("progressBar");


const selectionMessage =
    document.getElementById("selectionMessage");



/* =====================================================
   GET DIFFICULTY NAME
===================================================== */


function getDifficultyName(difficulty) {

    const names = {

        easy: "Easy",

        medium: "Medium",

        hard: "Hard",

        advanced: "Advanced",

        interview: "Interview Level"

    };

    return names[difficulty];

}



/* =====================================================
   LOAD QUESTION
===================================================== */


function loadQuestion() {


    const q =
        questions[currentQuestion];


    selectedAnswer = null;

    answerSubmitted = false;


    /* Question number */

    questionNumber.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    /* Difficulty */

    difficultyText.textContent =
        getDifficultyName(q.difficulty);


    difficultyBadge.textContent =
        getDifficultyName(q.difficulty).toUpperCase();


    difficultyBadge.className =
        `difficulty ${q.difficulty}`;


    /* Question */

    questionText.textContent =
        q.question;


    /* Progress */

    const progress =
        ((currentQuestion + 1) / questions.length) * 100;

    progressBar.style.width =
        `${progress}%`;


    /* Remove old options */

    optionsContainer.innerHTML = "";


    /* Create options */

    q.options.forEach((option, index) => {


        const optionElement =
            document.createElement("div");


        optionElement.className =
            "option";


        optionElement.textContent =
            `${String.fromCharCode(65 + index)}. ${option}`;


        optionElement.addEventListener(
            "click",
            () => selectOption(index)
        );


        optionsContainer.appendChild(
            optionElement
        );

    });


    /* Reset feedback */

    feedback.className =
        "feedback";


    feedbackTitle.textContent =
        "";


    feedbackText.textContent =
        "";


    /* Reset button */

    submitButton.disabled = true;

    submitButton.textContent =
        "Submit Answer";


    submitButton.onclick =
        submitAnswer;


    selectionMessage.textContent =
        "Select an answer";

}



/* =====================================================
   SELECT OPTION
===================================================== */


function selectOption(index) {


    if (answerSubmitted) {

        return;

    }


    selectedAnswer = index;


    const allOptions =
        document.querySelectorAll(".option");


    allOptions.forEach(
        option => {

            option.classList.remove(
                "selected"
            );

        }
    );


    allOptions[index]
        .classList.add("selected");


    submitButton.disabled =
        false;


    selectionMessage.textContent =
        "Answer selected";

}



/* =====================================================
   SUBMIT ANSWER
===================================================== */
function submitAnswer() {

    if (selectedAnswer === null) {
        return;
    }


    /* If answer was already submitted,
       move to the next question */

    if (answerSubmitted) {

        nextQuestion();

        return;

    }


    answerSubmitted = true;


    const q = questions[currentQuestion];


    const allOptions =
        document.querySelectorAll(".option");


    /* --------------------------------
       SHOW CORRECT ANSWER
    -------------------------------- */

    allOptions[q.answer]
        .classList.add("correct");


    /* --------------------------------
       SHOW WRONG ANSWER
    -------------------------------- */

    if (selectedAnswer !== q.answer) {

        allOptions[selectedAnswer]
            .classList.add("wrong");

    }


    /* --------------------------------
       SCORE + FEEDBACK
    -------------------------------- */

    if (selectedAnswer === q.answer) {

        score++;

        difficultyScores[q.difficulty]++;


        feedbackTitle.textContent =
            "✓ Correct!";


        feedback.className =
            "feedback correct-feedback";


        feedbackText.innerHTML = `
            <strong>Great job!</strong><br><br>
            ${q.explanation}
        `;

    }

    else {

        feedbackTitle.textContent =
            "✗ Incorrect";


        feedback.className =
            "feedback wrong-feedback";


        const correctOption =
            q.options[q.answer];


        const selectedOption =
            q.options[selectedAnswer];


        feedbackText.innerHTML = `
            <strong>Your answer:</strong>
            ${selectedOption}
            <br><br>

            <strong>Correct answer:</strong>
            ${correctOption}
            <br><br>

            <strong>Explanation:</strong><br>
            ${q.explanation}
        `;

    }


    /* --------------------------------
       DISABLE OPTIONS
    -------------------------------- */

    allOptions.forEach(
        option => {

            option.style.pointerEvents =
                "none";

        }
    );


    /* --------------------------------
       CHANGE BUTTON
    -------------------------------- */

    submitButton.textContent =
        currentQuestion === questions.length - 1
            ? "View Results"
            : "Next Question";

}

    /* Explanation */

 async function loadQuestionsFromDatabase() {

    try {

        console.log("Loading Percentage questions...");


        const response = await fetch(
            "/api/questions?topic=Percentage"
        );


        if (!response.ok) {

            throw new Error(
                "Server returned " + response.status
            );

        }


        const databaseQuestions =
            await response.json();


        console.log(
            "Questions received from database:",
            databaseQuestions
        );


        questions = databaseQuestions.map(q => ({

            id: q.id,

            question: q.question,

            options: [
                q.option_a,
                q.option_b,
                q.option_c,
                q.option_d
            ],

            answer:
                q.correct_answer
                    .charCodeAt(0) - 65,

            difficulty:
                q.difficulty.toLowerCase(),

            explanation:
                q.explanation || "No explanation available."

        }));


        console.log(
            "Questions loaded:",
            questions
        );


        if (questions.length === 0) {

            throw new Error(
                "No Percentage questions found in database."
            );

        }


        currentQuestion = 0;

        score = 0;

        selectedAnswer = null;

        answerSubmitted = false;


        loadQuestion();


    } catch (error) {

        console.error(
            "Error loading questions:",
            error
        );


        document.getElementById(
            "questionText"
        ).textContent =
            "Unable to load questions.";


        document.getElementById(
            "options"
        ).innerHTML = `
            <p style="color:red;">
                Error loading questions.
                Check the browser console.
            </p>
        `;

    }

}
loadQuestionsFromDatabase();


/* =====================================================
   NEXT QUESTION
===================================================== */


function nextQuestion() {


    currentQuestion++;


    if (currentQuestion >= questions.length) {

        showResult();

        return;

    }


    loadQuestion();

}



/* =====================================================
   SHOW RESULT
===================================================== */


function showResult() {


    document.getElementById("quiz")
        .style.display = "none";


    document.getElementById("result")
        .style.display = "block";


    /* Main score */

    document.getElementById("finalScore")
        .textContent =
        `${score} / ${questions.length}`;


    /* Percentage */

    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document.getElementById("percentageScore")
        .textContent =
        `${percentage}%`;



    /* Difficulty scores */

    document.getElementById("easyScore")
        .textContent =
        `${difficultyScores.easy} / 5`;


    document.getElementById("mediumScore")
        .textContent =
        `${difficultyScores.medium} / 5`;


    document.getElementById("hardScore")
        .textContent =
        `${difficultyScores.hard} / 5`;


    document.getElementById("advancedScore")
        .textContent =
        `${difficultyScores.advanced} / 5`;


    document.getElementById("interviewScore")
        .textContent =
        `${difficultyScores.interview} / 5`;



    /* Result message */

    let message;


    if (percentage >= 90) {

        message =
            "Excellent! You are performing at an interview-ready level.";

    }

    else if (percentage >= 75) {

        message =
            "Great work! Keep practicing the harder questions.";

    }

    else if (percentage >= 60) {

        message =
            "Good start. Review the formulas and practice again.";

    }

    else {

        message =
            "Keep practicing. Master the basics before moving to advanced questions.";

    }


    document.getElementById("resultMessage")
        .textContent =
        message;

}



/* =====================================================
   RESTART QUIZ
===================================================== */


function restartQuiz() {


    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;

    answerSubmitted = false;


    difficultyScores = {

        easy: 0,

        medium: 0,

        hard: 0,

        advanced: 0,

        interview: 0

    };


    document.getElementById("quiz")
        .style.display = "block";


    document.getElementById("result")
        .style.display = "none";


    loadQuestion();

}



/* =====================================================
   START QUIZ
===================================================== */


loadQuestionsFromDatabase();


</script>


</body>

</html>
